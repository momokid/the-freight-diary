name: Deploy to cPanel

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo, pdo_mysql, tokenizer, xml, ctype, json, bcmath

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Composer dependencies
        run: composer install --optimize-autoloader --no-dev --no-interaction --prefer-dist

      - name: Install Node dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Create production .env
        run: |
          echo "APP_NAME=\"Freight Diary\"" > .env
          echo "APP_ENV=production" >> .env
          echo "APP_KEY=${{ secrets.APP_KEY }}" >> .env
          echo "APP_DEBUG=false" >> .env
          echo "APP_URL=${{ secrets.APP_URL }}" >> .env
          echo "MANIFEST_HBL_PREFIX=${{ secrets.MANIFEST_HBL_PREFIX }}" >> .env
          echo "COMPANY_LOGO=\"images/logo.png\"" >> .env
          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=${{ secrets.DB_DATABASE }}" >> .env
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "ARKESEL_API_KEY=${{ secrets.ARKESEL_API_KEY }}" >> .env
          echo "ARKESEL_SENDER_ID=${{ secrets.ARKESEL_SENDER_ID }}" >> .env
          echo "ARKESEL_SMS_URL=${{ secrets.ARKESEL_SMS_URL }}" >> .env
          echo "ARKESEL_SANDBOX=false" >> .env
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env
          echo "ANTHROPIC_MODEL=claude-haiku-4-5" >> .env
          echo "BL_PARSER_PROVIDER=claude" >> .env
          echo "HS_CODE_MODEL=claude-sonnet-4-6" >> .env
          echo "HS_CODE_FALLBACK_MODEL=claude-haiku-4-5" >> .env
          echo "GLM_API_KEY=${{ secrets.GLM_API_KEY }}" >> .env
          echo "GLM_BASE_URL=https://api.z.ai/api/paas/v4" >> .env
          echo "GLM_MODEL=glm-4.5-flash" >> .env
          echo "GLM_TIMEOUT=10" >> .env
          echo "AGENT_LLM_DRIVER=claude" >> .env
          echo "AGENT_CONFIDENCE_FLOOR=0.70" >> .env
          echo "META_WHATSAPP_TOKEN=${{ secrets.META_WHATSAPP_TOKEN }}" >> .env
          echo "META_PHONE_NUMBER_ID=${{ secrets.META_PHONE_NUMBER_ID }}" >> .env
          echo "META_WABA_ID=${{ secrets.META_WABA_ID }}" >> .env
          echo "META_VERIFY_TOKEN=${{ secrets.META_VERIFY_TOKEN }}" >> .env
          echo "META_WHATSAPP_API_URL=https://graph.facebook.com/v19.0" >> .env
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
          echo "GROQ_MODEL=llama-3.2-90b-vision-preview" >> .env
          echo "ALERT_ETA_ENABLED=true" >> .env
          echo "ALERT_DIGEST_EMAILS=${{ secrets.ALERT_DIGEST_EMAILS }}" >> .env
          echo "SESSION_DRIVER=file" >> .env
          echo "SESSION_LIFETIME=120" >> .env
          echo "CACHE_STORE=file" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "MAIL_MAILER=smtp" >> .env
          echo "MAIL_SCHEME=smtps" >> .env
          echo "MAIL_HOST=${{ secrets.MAIL_HOST }}" >> .env
          echo "MAIL_PORT=465" >> .env
          echo "MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}" >> .env
          echo "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" >> .env
          echo "MAIL_FROM_ADDRESS=\"${{ secrets.MAIL_FROM_ADDRESS }}\"" >> .env

      # No config:cache / route:cache / view:cache here.
      # Caching on the runner bakes /home/runner/... paths into
      # bootstrap/cache/config.php, which breaks every request on the server.
      # Deployment is FTP-only, so artisan cannot run remotely.

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_PATH }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/bootstrap/cache/*.php
